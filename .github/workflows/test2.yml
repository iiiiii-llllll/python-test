name: CI/CD Pipeline

on:
  push:
    paths:
      - '**.py'
      - 'requirements.txt'
      workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install pytest

      - name: 运行测试（CI阶段）
        run: pytest -v

  deploy:
    runs-on: ubuntu-latest
    needs: test          # ← 关键：必须等 test job 通过才执行
    steps:
      - name: 模拟部署（CD阶段）
        run: echo "✅ 测试通过！开始部署到生产环境..."

      - name: 部署完成
        run: echo "🚀 部署成功！新版本已上线。"
